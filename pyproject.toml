[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saveparty"
version = "0.4.0"
description = "Share co-op game saves with friends through a shared cloud folder (OneDrive/Google Drive/Dropbox) - any compatible game, with a gamer-styled UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rusu" }]
keywords = ["save-sync", "co-op", "cloud", "game-saves", "palworld", "valheim"]
dependencies = [
    "customtkinter>=5.2",
    "pillow>=10.0",
    "psutil>=5.9",
    "watchdog>=4.0",
    "palworld-save-tools>=0.24",
    "pyooz",
]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.gui-scripts]
saveparty = "saveparty.ui.app:run"

[tool.setuptools.packages.find]
include = ["saveparty*"]
